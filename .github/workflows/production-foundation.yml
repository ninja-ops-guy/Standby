name: Production Foundation Qualification

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - "src/db/schema.ts"
      - "src/lib/ledger.ts"
      - "src/lib/production-transactions.ts"
      - "src/lib/transaction-state.ts"
      - "src/lib/transfer-policy.ts"
      - "src/lib/payments/**"
      - "src/app/api/payments/**"
      - "src/lib/disputes.ts"
      - "src/lib/operator-auth.ts"
      - "src/app/admin/**"
      - "src/app/api/admin/**"
      - "src/app/api/disputes/**"
      - "src/components/admin-controls.tsx"
      - "src/lib/auth.ts"
      - "src/lib/auth-tokens.ts"
      - "src/lib/rate-limit.ts"
      - "src/lib/email/**"
      - "src/app/api/auth/**"
      - "src/proxy.ts"
      - "next.config.ts"
      - "scripts/qualify-transaction-*.mjs"
      - "scripts/qualify-transfer-policy-*.mjs"
      - "scripts/qualify-payment-foundation-*.mjs"
      - "scripts/qualify-disputes-admin-*.mjs"
      - "scripts/qualify-security-baseline-*.mjs"
      - "package.json"
      - ".github/workflows/production-foundation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: standby
          POSTGRES_PASSWORD: standby
          POSTGRES_DB: standby_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U standby -d standby_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://standby:standby@127.0.0.1:5432/standby_test
      APP_ORIGIN: http://localhost:3000
      RATE_LIMIT_SECRET: qualification-rate-limit-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Structural transaction qualification
        run: npm run qualify:transaction

      - name: Apply schema to ephemeral PostgreSQL
        run: npx drizzle-kit push --force

      - name: Runtime transaction qualification
        run: node scripts/qualify-transaction-runtime.mjs

      - name: Structural transfer-policy qualification
        run: npm run qualify:transfer-policy

      - name: Runtime transfer-policy qualification
        run: node scripts/qualify-transfer-policy-runtime.mjs

      - name: Structural payment foundation qualification
        run: npm run qualify:payments

      - name: Runtime payment foundation qualification
        run: node scripts/qualify-payment-foundation-runtime.mjs

      - name: Structural disputes/admin qualification
        run: npm run qualify:disputes

      - name: Runtime disputes/admin qualification
        run: node scripts/qualify-disputes-admin-runtime.mjs

      - name: Structural security baseline qualification
        run: npm run qualify:security

      - name: Runtime security baseline qualification
        run: node scripts/qualify-security-baseline-runtime.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
